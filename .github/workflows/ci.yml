name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Contenido, tipos y tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Contenido primero: es el control más rápido y el que más falla al
      # escribir lecciones. Falla en 2 s en vez de después de un build.
      - name: Validar contenido
        run: npm run content:check

      - name: Paridad de traducciones
        run: npm run i18n:check

      - name: Tests unitarios
        run: npm test

      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: ci-only-secret

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # La imagen oficial trae las dependencias de sistema del navegador, que
    # `playwright install --with-deps` necesitaría instalar con sudo.
    container:
      image: mcr.microsoft.com/playwright:v1.50.0-noble

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: ci-only-secret

      - name: Playwright
        run: npx playwright test
        env:
          SESSION_SECRET: ci-only-secret

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
